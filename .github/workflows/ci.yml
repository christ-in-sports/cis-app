name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Non-blocking: the repo has 71 pre-existing lint errors in files unrelated
      # to this PR. Flip to blocking once that backlog is cleared (tracked separately).
      - run: npm run lint
        continue-on-error: true

      - run: npm run type-check

      - run: npm run test -- --ci

      - run: npm run build

  db-tests:
    name: Database (RLS policy tests)
    runs-on: ubuntu-latest
    # Docker ships preinstalled on GitHub-hosted runners, so `supabase start` can
    # spin up a real local Postgres here even though the CLI needs Docker to do it
    # (see docs/arch_decisions.md for why RLS is tested against a real database
    # rather than mocked). This runs against a throwaway local stack only -- it
    # never touches the linked production project.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx supabase start

      - run: npm run test:db

      - if: always()
        run: npx supabase stop

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # NEXT_PUBLIC_* vars are shipped to the browser bundle by design (Next.js convention) and
    # protected by RLS, not secrecy — safe to set directly here rather than as repo secrets.
    # Without them, createServerSupabaseClient() throws on every request and the app never boots.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://lbvfrplrujisypndgtin.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_rAsGATxkK481IX-C3gA6Lg_KvNzkqba
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
