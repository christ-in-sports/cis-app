name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Non-blocking: the repo has 71 pre-existing lint errors in files unrelated
      # to this PR. Flip to blocking once that backlog is cleared (tracked separately).
      - run: npm run lint
        continue-on-error: true

      - run: npm run type-check

      - run: npm run test -- --ci

      - run: npm run build

  db-tests:
    name: Database (RLS policy tests)
    runs-on: ubuntu-latest
    # Docker ships preinstalled on GitHub-hosted runners, so `supabase start` can
    # spin up a real local Postgres here even though the CLI needs Docker to do it
    # (see docs/arch_decisions.md for why RLS is tested against a real database
    # rather than mocked). This runs against a throwaway local stack only -- it
    # never touches the linked production project.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx supabase start

      - run: npm run test:db

      - if: always()
        run: npx supabase stop

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Runs against a LOCAL Supabase stack, not the hosted project. The roster
    # import suite signs users in and truncates kids/registrations so its counts
    # are exact, which must never happen to real data — and a shared remote also
    # makes runs order-dependent between concurrent PRs. These are the standard
    # local-stack keys, identical on every machine, so they are not secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Docker ships preinstalled on GitHub-hosted runners, so this needs no setup.
      - run: npx supabase start

      - run: npm run test:e2e

      - if: always()
        run: npx supabase stop

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
