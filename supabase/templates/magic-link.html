<!-- Sent when someone asks for a sign-in code (ENG-28), including a new parent.
     Generated by `npm run emails:build` from src/lib/email/auth-templates.ts; edit that, not this file. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Your Christ in Sports code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #F5F1E8;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: #F5F1E8;">Your sign-in code is inside. It expires in an hour.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F5F1E8" style="background-color: #F5F1E8;">
      <tr>
        <td align="center" style="padding: 24px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFDF8" style="max-width: 440px; background-color: #FFFDF8; border-radius: 26px;">
            <tr>
              <td align="center" style="padding: 28px 24px 0;">
                <img src="{{ .SiteURL }}/assets/fish-mark.png" alt="Christ in Sports" width="132" height="49" style="display: block; border: 0; width: 132px; height: auto;" />
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 24px 0; font-family: 'Caprasimo', Georgia, 'Times New Roman', serif; font-size: 26px; line-height: 1.15; font-weight: normal; color: #1F2A33; text-align: center;">
                Your sign-in code
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 24px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr><td height="5" bgcolor="#1A232B" style="height: 5px; line-height: 5px; font-size: 0; background-color: #1A232B; border-radius: 3px;">&nbsp;</td></tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 24px 0; font-family: 'Figtree', Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #1F2A33;">
                Type this code into the app to sign in:
              </td>
            </tr>
            <tr>
              <td style="padding: 14px 24px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#F7F3EA" style="padding: 16px 8px; background-color: #F7F3EA; border: 2px solid #1A232B; border-radius: 14px; font-family: 'Figtree', Arial, Helvetica, sans-serif; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: 8px; color: #1F2A33;">
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 24px 0; font-family: 'Figtree', Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.5; color: #5F5850;">
                It works once and expires in an hour. If you did not ask for it, you can ignore this email.
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 0 0; font-size: 0; line-height: 0;">&nbsp;</td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 440px;">
            <tr>
              <td align="center" style="padding: 16px 8px 0; font-family: 'Figtree', Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; color: #5F5850;">
                Christ in Sports &middot; St. Antonious Coptic Orthodox Church, Hayward
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
